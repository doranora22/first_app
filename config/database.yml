# config/database.yml

default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: root123    # metti qui la password del tuo utente MySQL
  host: localhost

development:
  <<: *default
  database: first_app_development

test:
  <<: *default
  database: first_app_test

production:
  <<: *default
  database: first_app_production
  username: root
  password: root123    # opzionale, cambia se vuoi